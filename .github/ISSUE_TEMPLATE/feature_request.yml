name: Feature request
description: Propose an addition or improvement to the SDKs, CLI, viewer, or tooling.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For changes to the format itself (new payloads, XMP properties, conformance rules), use the "Spec issue" template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? API sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other designs you rejected and why.
    validations:
      required: false
