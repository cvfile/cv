name: docs build check

# Verifies the docs site, its AI mode API and the API's docs index still build
# on every PR that touches docs, the viewer, the spec or the READMEs the index
# reads. cvfile.org is deployed from main by the maintainer's server, which
# builds docs/Dockerfile; this workflow catches a broken build at review time.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "spec/cv-1.0.md"
      - "packages/viewer-web/**"
      - "**/README.md"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "spec/cv-1.0.md"
      - "packages/viewer-web/**"
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

# onnxruntime-node's postinstall downloads CUDA binaries when it finds CUDA on the runner, and that
# download answered 404 on 19 November 2026. Every job runs on the CPU build the package ships.
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  # cvfile.org's public TensorPass site key, which the docs build puts in its pages (docs/astro.config.mjs),
  # kept as a repository variable.
  PUBLIC_TENSORPASS_SITE_KEY: ${{ vars.PUBLIC_TENSORPASS_SITE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @cvfile/viewer-web imports types from @cvfile/sdk; build sdk first
      # so the .d.ts files exist when tsup runs its DTS step.
      - run: pnpm --filter @cvfile/sdk build
      - run: pnpm --filter @cvfile/viewer-web build
      - run: pnpm --filter @cvfile/docs build
      - name: Sanity-check the built site
        working-directory: docs/dist
        run: |
          test -f index.html
          test -f spec/index.html
          test -f install/index.html
          test -f view/index.html
          test -f ecosystem/index.html
          test -f create/index.html
          test -f aiconnect/callback/index.html
          test -f ../server/dist/server.mjs
          test -f ../server/dist/docs-index.json
          test -f ../server/dist/packages.json
          echo "7 pages and the API bundle present"
