name: docs build check

# Verifies the docs site still builds on every PR that touches docs, the
# viewer, or the spec. Vercel handles the actual deployment via cvfile.org —
# this workflow exists so a broken docs build is caught at PR review time
# instead of on the next Vercel deploy.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "spec/cv-1.0.md"
      - "packages/viewer-web/**"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "spec/cv-1.0.md"
      - "packages/viewer-web/**"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cvfile/viewer-web build
      - run: pnpm --filter @cvfile/docs build
      - name: Sanity-check the built site
        working-directory: docs/dist
        run: |
          test -f index.html
          test -f spec/index.html
          test -f install/index.html
          test -f view/index.html
          test -f ecosystem/index.html
          echo "5/5 expected pages present"
