name: publish npm packages

on:
  push:
    tags:
      - "sdk-js/v*"
      - "embed-js/v*"
      - "server-node/v*"
      - "viewer-web/v*"
  # Manual re-fire for an existing tag. GitHub suppresses tag events when
  # more than three tags land in a single push, so a batch release push can
  # silently skip this workflow; dispatching with the tag name recovers it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example embed-js/v0.3.1)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, which implements OIDC trusted publishing.
          # No registry-url: it would write an .npmrc with an empty _authToken
          # placeholder that suppresses OIDC and forces an unauthenticated publish.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm -r build
      - name: Test all packages (skip live HF when no token)
        # Run the full suite, not just the tagged package: sibling packages
        # depend on @cvfile/sdk via workspace:*, so a regression anywhere
        # should block the publish.
        run: pnpm -r test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Publish package matching the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # npm's OIDC trusted publishing is implemented by the npm CLI (>= 11.5.1),
          # not by `pnpm publish` (whose token exchange 404s against npm). So we
          # pack with pnpm (which rewrites the workspace:* dep on @cvfile/sdk to a
          # real version inside the tarball) and publish that tarball with npm.
          echo "node $(node -v), npm $(npm -v), oidc=${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          tag="${INPUT_TAG:-${GITHUB_REF##refs/tags/}}"
          case "$tag" in
            sdk-js/v*)      dir="packages/sdk-js" ;;
            embed-js/v*)    dir="packages/embed-js" ;;
            server-node/v*) dir="packages/server-middleware-node" ;;
            viewer-web/v*)  dir="packages/viewer-web" ;;
            *) echo "unknown tag: $tag" && exit 1 ;;
          esac
          cd "$dir"
          pnpm pack
          npm publish ./*.tgz --access public --provenance
