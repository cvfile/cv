name: publish npm packages

on:
  push:
    tags:
      - "sdk-js/v*"
      - "embed-js/v*"
      - "server-node/v*"
      - "viewer-web/v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm -r build
      - name: Publish package matching the tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag="${GITHUB_REF##refs/tags/}"
          case "$tag" in
            sdk-js/v*)      filter="@cvfile/sdk" ;;
            embed-js/v*)    filter="@cvfile/embed" ;;
            server-node/v*) filter="@cvfile/server" ;;
            viewer-web/v*)  filter="@cvfile/viewer-web" ;;
            *) echo "unknown tag: $tag" && exit 1 ;;
          esac
          pnpm --filter "$filter" publish --access public --no-git-checks --provenance
