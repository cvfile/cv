name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep so alerts surface even during quiet weeks.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Needed by the CodeQL action to read run metadata on private forks;
      # harmless on public repos.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, go, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # All three compiled/interpreted targets analyse fine without a
          # build; Go has supported build-mode none since CodeQL 2.16.
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
