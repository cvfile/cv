name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep so alerts surface even during quiet weeks.
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # Needed by the CodeQL action to read run metadata on private forks;
      # harmless on public repos.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          # The Go extractor rejects build-mode none (CodeQL 2.25 fatals with
          # "Go does not support the none build mode"); autobuild compiles
          # the module tree instead.
          - language: go
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version: "1.26"
          cache-dependency-path: sdks/go/go.sum
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
