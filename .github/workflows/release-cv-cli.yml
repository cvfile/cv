name: release cv CLI

on:
  push:
    tags: ["cv-go/v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: sdks/go/go.sum
      - name: Extract semver from cv-go/v* tag and re-tag for GoReleaser
        # GoReleaser's monorepo support is Pro-only; OSS GoReleaser only
        # accepts plain `vX.Y.Z` tags. Strip the `cv-go/` prefix and apply
        # a local semver tag pointing at the same commit so GoReleaser sees
        # the version it needs. The temp tag is never pushed.
        run: |
          full="${GITHUB_REF##refs/tags/}"
          version="${full#cv-go/}"
          echo "Releasing $version (from $full)"
          git tag "$version"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
          workdir: sdks/go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
