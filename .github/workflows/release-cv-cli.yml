name: release cv CLI

on:
  push:
    tags: ["sdks/go/v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: sdks/go/go.sum
      - name: Install syft for SBOM generation
        # GoReleaser shells out to syft for software-bill-of-materials
        # generation (the sboms: stanza in .goreleaser.yml). Anchore ships
        # an official installer that drops the binary into /usr/local/bin.
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Extract semver from sdks/go/v* tag and re-tag for GoReleaser
        # GoReleaser's monorepo support is Pro-only; OSS GoReleaser only
        # accepts plain `vX.Y.Z` tags. Strip the `sdks/go/` prefix and apply
        # a local semver tag pointing at the same commit so GoReleaser sees
        # the version it needs. The temp tag is never pushed.
        #
        # `sdks/go/vX.Y.Z` is also the canonical Go module tag format for
        # submodules at github.com/cvfile/cv/sdks/go, so the same tag drives
        # both pkg.go.dev indexing and the CLI binary release.
        run: |
          full="${GITHUB_REF##refs/tags/}"
          version="${full#sdks/go/}"
          echo "Releasing $version (from $full)"
          git tag "$version"
          echo "cv_version=$version" >> "$GITHUB_ENV"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
          workdir: sdks/go
        env:
          # Pin the tag explicitly. Sibling packages tag the same release
          # commit (sdk-js/v*, viewer-web/v*, ...), so GoReleaser's git-state
          # autodetection can otherwise pick a non-semver sibling tag and fail
          # to parse it. This forces the plain semver re-tag created above.
          GORELEASER_CURRENT_TAG: ${{ env.cv_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          SCOOP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
