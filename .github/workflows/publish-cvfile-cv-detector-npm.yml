name: publish cvfile-cv-detector (npm)

on:
  push:
    tags: ["cvfile-cv-detector-ts/v*"]

permissions:
  contents: read
  # Required for npm OIDC provenance attestations.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        working-directory: tools/cv-detector/typescript
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build
        working-directory: tools/cv-detector/typescript
        run: pnpm build
      - name: Publish
        working-directory: tools/cv-detector/typescript
        # Publish with the npm CLI (>= 11.5.1) so npm's OIDC trusted publishing
        # is used; `pnpm publish`'s token exchange 404s against npm. This package
        # has no workspace: deps, so npm can pack from source directly.
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance
