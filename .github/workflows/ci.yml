name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS / TS (sdk + embed + server + viewer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Test (skip live HF when no token)
        run: pnpm -r test
        env:
          # Set HF_TOKEN as a repo secret to enable the live BGE-M3 round-trip
          # in @cvfile/embed; otherwise that single test self-skips.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - run: pnpm lint
      - run: pnpm typecheck

  python:
    name: Python (cvfile + cvfile.embed + cvfile.server)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: pipx install uv
      - name: Install package + dev extras
        working-directory: sdks/python
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run tests
        working-directory: sdks/python
        run: .venv/bin/pytest -q
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  go:
    name: Go (cv-go + cv CLI + middleware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: sdks/go/go.sum
      - working-directory: sdks/go
        run: go test ./...
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  integrations:
    name: Python integrations (langchain + llama-index + haystack)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        integration:
          - integrations/langchain-cvfile
          - integrations/llama-index-readers-cvfile
          - integrations/cvfile-haystack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pipx install uv
      - name: Install package + dev extras
        working-directory: ${{ matrix.integration }}
        # The workspace cvfile SDK is installed first so CI tests the code in
        # this checkout. Resolving cvfile from PyPI instead would race every
        # release: the integrations pin the new SDK floor before the wheel is
        # published, which is exactly the window a push lands in.
        run: |
          uv venv
          uv pip install -e ../../sdks/python -e ".[dev]"
      - name: Run tests
        working-directory: ${{ matrix.integration }}
        run: .venv/bin/pytest -q

  cv-detector:
    name: cv-detector (Go + TS + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: tools/cv-detector/go/go.sum
      - name: Go detector tests
        working-directory: tools/cv-detector/go
        run: go test ./...
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TS detector dependencies
        working-directory: tools/cv-detector/typescript
        # No --ignore-workspace: this package has its own pnpm-workspace.yaml
        # (with the esbuild build approval pnpm 11 requires); --ignore-workspace
        # would skip it and fail with ERR_PNPM_IGNORED_BUILDS.
        run: pnpm install --frozen-lockfile
      - name: TS detector tests
        working-directory: tools/cv-detector/typescript
        run: pnpm test
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pipx install uv
      - name: Python detector tests
        # `uv run` provisions the project plus its dev dependency group
        # (pytest) on the fly; no explicit venv step needed.
        working-directory: tools/cv-detector/python
        run: uv run pytest -q

  verapdf:
    name: PDF/A-3u conformance gate (veraPDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build sample fixture
        run: |
          cd packages/sdk-js
          pnpm build
          npx tsx examples/build-jane-doe.ts
      - name: Run veraPDF
        # `--nonpdfext` allows the .cv extension; without it veraPDF refuses
        # to scan files whose names don't end in .pdf.
        run: |
          docker run --rm -v "$PWD:/work" verapdf/cli --nonpdfext /work/packages/sdk-js/examples/out/jane-doe.cv -f 3u
