name: publish langchain-cvfile

on:
  push:
    tags: ["langchain-cvfile/v*"]

permissions:
  contents: read
  # Required for PyPI Trusted Publisher (no token needed once configured at
  # https://pypi.org/manage/account/publishing/).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pipx install build
      - name: Build wheel + sdist
        working-directory: integrations/langchain-cvfile
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/langchain-cvfile/dist
