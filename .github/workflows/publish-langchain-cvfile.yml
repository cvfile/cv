name: publish langchain-cvfile

on:
  push:
    tags: ["langchain-cvfile/v*"]
  # Manual re-fire for an existing tag (tag events are suppressed when more
  # than three tags land in one push, and PyPI index propagation can race
  # a fresh dependency floor).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish"
        required: true

permissions:
  contents: read
  # Required for PyPI Trusted Publisher (no token needed once configured at
  # https://pypi.org/manage/account/publishing/).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pipx install uv
      - name: Install package + dev extras
        working-directory: integrations/langchain-cvfile
        run: |
          uv venv
          # The workspace cvfile SDK is installed first so the gate tests the
          # code in this checkout; resolving cvfile from PyPI would race index
          # propagation whenever the SDK floor was bumped in the same release.
          uv pip install -e ../../sdks/python -e ".[dev]"
      - name: Run tests before publishing
        working-directory: integrations/langchain-cvfile
        run: .venv/bin/pytest -q
      - name: Install build tools
        run: python -m pip install --upgrade build
      - name: Build wheel + sdist
        working-directory: integrations/langchain-cvfile
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/langchain-cvfile/dist
