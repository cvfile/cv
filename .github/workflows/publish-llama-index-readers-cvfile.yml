name: publish llama-index-readers-cvfile

on:
  push:
    tags: ["llama-index-readers-cvfile/v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pipx install uv
      - name: Install package + dev extras
        working-directory: integrations/llama-index-readers-cvfile
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run tests before publishing
        working-directory: integrations/llama-index-readers-cvfile
        run: .venv/bin/pytest -q
      - name: Install build tools
        run: python -m pip install --upgrade build
      - name: Build wheel + sdist
        working-directory: integrations/llama-index-readers-cvfile
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/llama-index-readers-cvfile/dist
