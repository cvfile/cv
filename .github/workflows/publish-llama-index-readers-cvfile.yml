name: publish llama-index-readers-cvfile

on:
  push:
    tags: ["llama-index-readers-cvfile/v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pipx install build
      - name: Build wheel + sdist
        working-directory: integrations/llama-index-readers-cvfile
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/llama-index-readers-cvfile/dist
