[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvfile-cv-detector"
version = "0.1.0"
description = "Tiny reference sniffer for the .cv open file format. Detects .cv wrapping inside any application/pdf and unwraps the canonical Markdown payload."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "cvfile.org maintainers", email = "contact@cvfile.org" }]
keywords = ["cv", "resume", "pdf", "open-format", "rag", "crawler", "sniffer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
dependencies = ["pypdf>=4,<6"]

[project.urls]
Homepage = "https://cvfile.org"
Source = "https://github.com/cvfile/cv/tree/main/tools/cv-detector/python"
Issues = "https://github.com/cvfile/cv/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cvfile_cv_detector"]
