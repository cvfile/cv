# WinGet installer manifest. Drop this file into
# `manifests/c/cvfile/cv/__VERSION__/` in a fork of microsoft/winget-pkgs
# and substitute the placeholders below with the values printed by
# GoReleaser (or read from the GitHub release page).
#
# Required substitutions (example values for the 0.3.1 release):
#   __VERSION__         e.g. 0.3.1
#   __RELEASE_DATE__    ISO 8601 date, e.g. 2026-07-02
#   __URL_X64__         e.g. https://github.com/cvfile/cv/releases/download/v0.3.1/cv_0.3.1_windows_x86_64.zip
#   __SHA256_X64__      SHA 256 of the x64 zip (from checksums.txt)
#   __URL_ARM64__       e.g. https://github.com/cvfile/cv/releases/download/v0.3.1/cv_0.3.1_windows_arm64.zip
#   __SHA256_ARM64__    SHA 256 of the arm64 zip (from checksums.txt)
#
# Note: the GitHub release lives under the plain `v__VERSION__` tag; the
# `sdks/go/` prefix used to trigger the release workflow never appears in
# download URLs.

PackageIdentifier: cvfile.cv
PackageVersion: __VERSION__
MinimumOSVersion: 10.0.17763.0
InstallerType: zip
NestedInstallerType: portable
Scope: user
InstallModes:
  - interactive
  - silent
  - silentWithProgress
NestedInstallerFiles:
  - RelativeFilePath: cv.exe
    PortableCommandAlias: cv
Commands:
  - cv
FileExtensions:
  - cv
ReleaseDate: __RELEASE_DATE__
Installers:
  - Architecture: x64
    InstallerUrl: __URL_X64__
    InstallerSha256: __SHA256_X64__
  - Architecture: arm64
    InstallerUrl: __URL_ARM64__
    InstallerSha256: __SHA256_ARM64__
ManifestType: installer
ManifestVersion: 1.6.0
