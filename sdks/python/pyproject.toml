[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvfile"
version = "0.3.2"
description = "Reference SDK for the .cv open file format: pack, extract, inspect, validate."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "cvfile.org" }]
keywords = ["cv", "resume", "pdf", "pdfa", "markdown", "embeddings", "rag", "ats"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pypdf>=5.0,<7",
  # embeddings.cbor is a first-class payload of the format; reading it must
  # work without extras. The embed extra only adds the network backend.
  "cbor2>=5.6",
]

[project.urls]
Homepage = "https://cvfile.org"
Repository = "https://github.com/cvfile/cv"
Issues = "https://github.com/cvfile/cv/issues"

[project.optional-dependencies]
embed = [
  "httpx>=0.27",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cvfile"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# Optional integration targets (LangChain, LlamaIndex) are not runtime deps of
# this SDK; their stubs are absent in CI. Treat only their imports as untyped.
[[tool.mypy.overrides]]
module = ["langchain_core.*", "llama_index.*"]
ignore_missing_imports = true
