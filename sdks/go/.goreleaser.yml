# GoReleaser config for the cv CLI.
# Cross-compiles to six targets and produces SBOMs + checksums + brew/scoop manifests.
# Run from sdks/go after tagging:
#   git tag sdks/go/v0.3.1
#   goreleaser release --clean

version: 2

project_name: cv

# We tag this binary as `sdks/go/vX.Y.Z` so the same tag also serves as the
# canonical Go module tag for github.com/cvfile/cv/sdks/go (pkg.go.dev picks
# it up automatically). GoReleaser's monorepo support is Pro-only, so the
# release-cv-cli.yml workflow strips the `sdks/go/` prefix and applies a
# local semver tag that GoReleaser consumes here.

before:
  hooks:
    - go mod tidy

builds:
  - id: cv
    main: ./cmd/cv
    binary: cv
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - id: cv-archive
    builds: [cv]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # `github` uses the compare API, which needs both tags on the remote.
  # Our workflow only pushes `sdks/go/vX.Y.Z`; the stripped `vX.Y.Z` tag is
  # local-only, so the compare endpoint 404s. Use git log instead.
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Other
      order: 999

brews:
  - name: cv
    repository:
      owner: cvfile
      name: homebrew-tap
      branch: main
      # Force the cross-repo PAT explicitly. Without this, GoReleaser falls
      # back to GITHUB_TOKEN, which in Actions only has write access to the
      # repo running the workflow — the cross-repo PUT then 403s.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # Homebrew searches `Formula/`, `HomebrewFormula/`, and the repo root.
    # Pin to Formula/ so the layout matches every other community tap.
    directory: Formula
    homepage: "https://cvfile.org"
    description: "CLI for the .cv open file format (PDF + Markdown + HTML + embeddings)"
    license: "Apache-2.0"
    install: |
      bin.install "cv"
    test: |
      assert_match "cv ", shell_output("#{bin}/cv version")

scoops:
  - name: cv
    repository:
      owner: cvfile
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_GITHUB_TOKEN }}"
    # Standard Scoop community bucket layout puts manifests under bucket/.
    # Without this, GoReleaser writes the manifest to the repo root, which
    # Scoop also accepts but is non-standard.
    directory: bucket
    homepage: "https://cvfile.org"
    description: "CLI for the .cv open file format"
    license: "Apache-2.0"

nfpms:
  - id: cv-deb-rpm
    builds: [cv]
    package_name: cvfile
    vendor: cvfile.org
    homepage: "https://cvfile.org"
    description: "CLI for the .cv open file format"
    license: "Apache-2.0"
    formats: [deb, rpm, apk]
    contents:
      - src: ../../tools/installer-payloads/linux/cvfile.desktop
        dst: /usr/share/applications/cvfile.desktop
      - src: ../../tools/installer-payloads/linux/application-vnd.cv+pdf.xml
        dst: /usr/share/mime/packages/application-vnd.cv+pdf.xml
    scripts:
      postinstall: scripts/postinstall.sh

release:
  github:
    owner: cvfile
    name: cv
  # Publish immediately; a draft release is a silent failure mode because
  # nobody remembers to click "Publish" and downstream package managers
  # (Homebrew, Scoop, WinGet) point at asset URLs that 404 until then.
  draft: false
  prerelease: auto
