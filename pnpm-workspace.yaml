packages:
  - 'packages/*'
  - 'docs'

# pnpm 11 hard-fails install when a package has a build script we haven't
# pre-approved. Listing every native-binary dep we transitively depend on
# keeps CI green; without these install errors with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - cbor-extract
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
