packages:
  - 'packages/*'
  - 'docs'

# pnpm 11's new build-approval system. Each native-binary dep needs an
# explicit `true` to run its install scripts; otherwise pnpm fails with
# ERR_PNPM_IGNORED_BUILDS. The legacy `onlyBuiltDependencies` array still
# exists but is now treated as a soft hint, not an approval.
allowBuilds:
  cbor-extract: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
