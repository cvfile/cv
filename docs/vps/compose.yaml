# cvfile.org on the VPS: two containers of one image, run by the cvfile account
# and deployed by that account from the main branch of this repository, as the
# cvfile app. `site` is nginx with the static pages, reachable only
# through Caddy on its loopback port. `api` is the AI mode's API (MCP server
# and event counters), reachable only from `site`, which sends it /api/.
#
# Root filesystems are read only. nginx writes its pid and temp files under
# /tmp, the tmpfs of the hardened service; the API writes nothing. The app's
# .env holds the Cloudflare purge settings deploy-app.sh reads on the host, so
# no container loads it.
services:
  site:
    extends:
      file: /opt/vps-automation/containers/hardened-service.yaml
      service: hardened
    image: cvfile:${RELEASE:?}
    ports:
      - 127.0.0.1:9524:8080
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    extends:
      file: /opt/vps-automation/containers/hardened-service.yaml
      service: hardened
    image: cvfile:${RELEASE:?}
    entrypoint:
      - node
      - /srv/api/server.mjs
    environment:
      PORT: '8787'
      SITE_DATA_DIR: /srv/api
      SITE_ORIGINS: https://cvfile.org
      NODE_OPTIONS: --max-old-space-size=96
    mem_limit: 160m
    cpus: 0.25
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8787/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
