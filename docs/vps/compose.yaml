# cvfile.org on its server: two containers of one image, deployed from the main
# branch of this repository by the unprivileged account that runs them. `site`
# is nginx with the static pages, reachable only through the host's reverse
# proxy on its loopback port. `api` is the AI mode's API (MCP server and event
# counters), reachable only from `site`, which sends it /api/.
#
# Both run with the posture below: a read only root filesystem with a tmpfs on
# /tmp (where nginx writes its pid and temp files; the API writes nothing),
# every Linux capability dropped, no privilege gained through setuid binaries,
# and capped logs. The app's .env holds the build's public settings and the
# host's cache purge settings, so no container loads it.
x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  site:
    <<: *hardened
    image: cvfile:${RELEASE:?}
    ports:
      - 127.0.0.1:9524:8080
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    <<: *hardened
    image: cvfile:${RELEASE:?}
    entrypoint:
      - node
      - /srv/api/server.mjs
    environment:
      PORT: '8787'
      SITE_DATA_DIR: /srv/api
      SITE_ORIGINS: https://cvfile.org
      NODE_OPTIONS: --max-old-space-size=96
    mem_limit: 160m
    cpus: 0.25
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8787/healthz
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
