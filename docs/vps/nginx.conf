# cvfile.org static site. nginx-unprivileged includes this file in its http
# block, as /etc/nginx/conf.d/default.conf, and writes its pid and temp files
# under /tmp, the one writable path of the container.
#
# It reproduces what the site had on Vercel: the headers and rewrites of
# vercel.json, and two behaviours of Vercel's static hosting the site relies
# on. Those are Access-Control-Allow-Origin on every file, which the published
# <script type="module" src="https://cvfile.org/embed/1/cv-embed.js"> snippet
# needs to load on other origins, and a directory answering with or without its
# trailing slash. There is no SPA fallback: an unknown path is a 404.

# /samples/jane-doe.cv gives the Markdown payload to a client asking for it.
map $http_accept $jane_doe_sample {
  default /samples-src/jane-doe.cv;
  ~text/markdown /samples-src/jane-doe.md;
}

# Astro hashes the names under /_astro/. Everything else, the embed script
# included, keeps its URL across releases, so clients revalidate it.
map $uri $cache_control {
  default no-cache;
  ~^/_astro/ 'public, max-age=31536000, immutable';
}

# $uri is the path after the rewrites, so the Markdown variant of a sample is
# left out. nginx omits a header whose value is empty.
map $uri $content_type_options {
  default '';
  ~\.cv$ nosniff;
}

# Only this URL answers by Accept. vercel.json declares no Vary, and a cache in
# front needs it to keep the two variants apart.
map $request_uri $samples_vary {
  default '';
  ~^/samples/jane-doe\.cv(\?|$) Accept;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/cvfile;
  index index.html;
  server_tokens off;

  # A types block replaces the inherited table, so it is included again here.
  # The stock table has no mjs, the extension of the pdf.js worker: a browser
  # refuses to run a module served as application/octet-stream.
  include /etc/nginx/mime.types;
  types {
    application/javascript mjs;
    application/pdf cv;
    text/markdown md;
  }
  charset utf-8;
  charset_types application/javascript application/json image/svg+xml text/css text/markdown text/plain text/xml;

  # Every header is set here, since one add_header in a location would drop
  # all of these for that location. The maps above pick the values.
  add_header Access-Control-Allow-Origin '*';
  add_header Cache-Control $cache_control;
  add_header X-Content-Type-Options $content_type_options;
  add_header Vary $samples_vary;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location = /sitemap.xml {
    rewrite ^ /sitemap-index.xml last;
  }

  location = /samples/jane-doe.cv {
    rewrite ^ $jane_doe_sample last;
  }

  location /samples/ {
    rewrite ^/samples/(.*)$ /samples-src/$1 last;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
