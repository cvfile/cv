[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-cvfile"
version = "0.3.2"
description = "LangChain document loader for the .cv open file format."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "cvfile.org" }]
keywords = ["langchain", "cv", "resume", "pdf", "pdfa", "rag", "ats", "document-loader"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cvfile>=0.3.2,<2",
  "langchain-core>=0.3,<2",
]

[project.urls]
Homepage = "https://cvfile.org"
Repository = "https://github.com/cvfile/cv"
Issues = "https://github.com/cvfile/cv/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_cvfile"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
