[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-readers-cvfile"
version = "0.3.2"
description = "LlamaIndex reader for the .cv open file format."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "cvfile.org" }]
keywords = ["llama-index", "cv", "resume", "pdf", "pdfa", "rag", "ats", "reader"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "cvfile>=0.3.2,<2",
  "llama-index-core>=0.11,<0.15",
]

[project.urls]
Homepage = "https://cvfile.org"
Repository = "https://github.com/cvfile/cv"
Issues = "https://github.com/cvfile/cv/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]

[tool.llamahub]
contains_example = false
import_path = "llama_index.readers.cvfile"

[tool.llamahub.class_authors]
CVFileReader = "cvfile.org"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_index"]

[tool.hatch.build.targets.wheel.sources]
"src/llama_index" = "llama_index"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
